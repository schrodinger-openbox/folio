<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folio – a social library for readers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F5F0E8;--sf:#FFFAF1;--ink:#171923;--mut:#77746F;--gold:#9A7432;--goldb:#C7A56A;--bur:#572C3B;--grn:#304C43;--ln:#17192322;--sh:0 10px 30px #17192322;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171923;--sf:#20232f;--ink:#F5F0E8;--mut:#a5a198;--gold:#C7A56A;--ln:#F5F0E822;--sh:0 10px 30px #0008}}
:root[data-theme="dark"]{--bg:#171923;--sf:#20232f;--ink:#F5F0E8;--mut:#a5a198;--gold:#C7A56A;--ln:#F5F0E822;--sh:0 10px 30px #0008}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0;letter-spacing:-.01em}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--goldb);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:6px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.logo{font:700 22px Fraunces,serif;margin-right:auto;cursor:pointer;background:none;border:0}
.tab{background:none;border:1px solid transparent;padding:7px 14px;border-radius:99px;color:var(--mut)}
.tab[aria-current=page]{border-color:var(--goldb);color:var(--ink)}
.btn{background:var(--goldb);color:#171923;border:0;border-radius:99px;padding:9px 18px;font-weight:600}
.btn.o{background:none;border:1px solid var(--ln);color:var(--ink)}
.btn.s{padding:5px 12px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
.hero{background:radial-gradient(ellipse at 50% 40%,#5a3b17 0,#2a1b0c 55%,#120c06 100%);color:#F5F0E8;margin:-24px -20px 0;padding:56px 20px 40px;overflow:hidden;position:relative}
.hero-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.05;max-width:11ch}
.hero p{color:#e5d9c3;max-width:42ch;font-size:17px}
.scene{height:380px;perspective:900px;position:relative}
.fb{position:absolute;width:110px;height:160px;transform-style:preserve-3d;animation:fl 7s ease-in-out infinite}
.fb .cv{width:110px;height:160px}
@keyframes fl{0%,100%{transform:translate3d(var(--x),var(--y),var(--z)) rotateY(-25deg) rotateX(8deg)}50%{transform:translate3d(var(--x),calc(var(--y) - 22px),var(--z)) rotateY(25deg) rotateX(-6deg)}}
.dust{position:absolute;width:3px;height:3px;border-radius:50%;background:#C7A56A;opacity:.6}
.cv{border-radius:3px 6px 6px 3px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 4px 0 0 #0004,var(--sh);aspect-ratio:2/3;overflow:hidden;border-top:2px solid #C7A56A88}
.cv i{font:700 13px/1.15 Fraunces,serif;font-style:normal}
.cv small{font-size:9px;opacity:.85}
.fb .cv i{font-size:14px}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.stats b{font:700 30px Fraunces,serif;color:#C7A56A;display:block}
.stats span{font-size:13px;color:#e5d9c3}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:36px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;box-shadow:var(--sh)}
.card h3{font-size:18px;margin-bottom:6px}
.card p{margin:0;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{border:1px solid var(--ln);background:none;border-radius:99px;padding:5px 13px;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hd{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hd h2{font-size:32px}
input[type=text],input[type=search],select,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px;margin-top:18px}
.bk .cv{cursor:pointer;transition:transform .2s}
.bk .cv:hover{transform:translateY(-6px) rotate(-1deg)}
.bk h4{margin:8px 0 0;font:600 14px Fraunces,serif}
.bk p{margin:0;font-size:12px;color:var(--mut)}
.bar{height:5px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--goldb)}
.ic{background:none;border:1px solid var(--ln);border-radius:8px;padding:3px 8px;font-size:13px}
.ic.on{background:var(--bur);color:#fff;border-color:var(--bur)}
.list .bk{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.list{display:grid;gap:10px;margin-top:18px}
.shelf{margin-top:18px;perspective:1100px}
.plank{display:flex;align-items:flex-end;gap:3px;padding:0 16px;min-height:210px;border-bottom:14px solid #4a2f1a;background:linear-gradient(#0000 85%,#0003);transform:rotateX(4deg);transform-origin:bottom;margin-bottom:14px;overflow-x:auto;border-radius:3px;box-shadow:0 14px 14px -10px #000a;background-color:#3a2412}
.sp{flex:none;border:0;border-radius:2px 2px 0 0;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;writing-mode:vertical-rl;font:600 12px Fraunces,serif;padding:10px 0;transition:transform .25s;box-shadow:inset 0 0 0 1px #fff2;border-top:3px solid #C7A56A99}
.sp:hover,.sp:focus-visible{transform:translateY(-16px) rotateZ(-3deg)}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}
.post{margin-top:16px}
.post .top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--bur)}
.q{font:italic 500 19px/1.4 Fraunces,serif;border-left:3px solid var(--goldb);padding-left:12px;margin:8px 0}
.pb{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0}
.pb .cv{width:56px;flex:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cm{font-size:14px;padding:6px 0 0 14px;color:var(--mut)}
.tag{font-size:11px;border:1px solid var(--goldb);border-radius:99px;padding:1px 8px;color:var(--gold)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:18px}
.col{cursor:pointer;border-radius:14px;overflow:hidden;background:var(--sf);border:1px solid var(--ln);text-align:left;padding:0;box-shadow:var(--sh)}
.stack{height:150px;position:relative;background:var(--th);overflow:hidden}
.stack .cv{position:absolute;width:80px;top:22px;box-shadow:0 8px 16px #0006;transition:transform .25s}
.col:hover .cv{transform:translateY(-6px)}
.col .in{padding:12px 14px}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--ink);max-width:560px;width:92%;padding:20px;box-shadow:var(--sh)}
dialog::backdrop{background:#000a}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;z-index:90}
@media (max-width:760px){.hero-in{grid-template-columns:1fr}.scene{height:300px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="top" aria-label="Main">
  <button class="logo" data-a="nav" data-v="landing" aria-label="Folio home">Folio</button>
  <button class="tab" data-a="nav" data-v="library">My Library</button>
  <button class="tab" data-a="nav" data-v="feed">Feed</button>
  <button class="tab" data-a="nav" data-v="cols">Collections</button>
  <button class="btn o s" data-a="theme" aria-label="Toggle light and dark theme">Theme</button>
</nav>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>

<script>
const B=[
{id:1,t:'Meditations',au:'Marcus Aurelius',pg:254,g:'Philosophy',a:'#5b6b3a',b:'#2a3320'},
{id:2,t:'Animal Farm',au:'George Orwell',pg:112,g:'Fiction',a:'#2a2a2a',b:'#9c2a22'},
{id:3,t:'Letters from a Stoic',au:'Seneca',pg:254,g:'Philosophy',a:'#111',b:'#5a5348'},
{id:4,t:'The 48 Laws of Power',au:'Robert Greene',pg:452,g:'Psychology',a:'#c8202c',b:'#1b2a8c'},
{id:5,t:'The Little Prince',au:'Antoine de Saint-Exupéry',pg:96,g:'Fiction',a:'#1f3a8c',b:'#0e1a4a'},
{id:6,t:'The Call of Cthulhu',au:'H. P. Lovecraft',pg:64,g:'Horror',a:'#3d1f26',b:'#0f2b2a'},
{id:7,t:'Dune',au:'Frank Herbert',pg:688,g:'Science fiction',a:'#c98a3b',b:'#6b3a14'},
{id:8,t:'Frankenstein',au:'Mary Shelley',pg:280,g:'Gothic',a:'#304C43',b:'#121f1b'},
{id:9,t:'Pride and Prejudice',au:'Jane Austen',pg:432,g:'Romance',a:'#a65b72',b:'#572C3B'},
{id:10,t:'The Stranger',au:'Albert Camus',pg:123,g:'Philosophy',a:'#d9c9a0',b:'#8b6e3a'},
{id:11,t:'Siddhartha',au:'Hermann Hesse',pg:152,g:'Fiction',a:'#2f7d77',b:'#14403d'},
{id:12,t:'Crime and Punishment',au:'Fyodor Dostoevsky',pg:671,g:'Literary fiction',a:'#6a1f2b',b:'#241015'}];
const bk=id=>B.find(b=>b.id==id);
const ST={reading:'Currently reading',want:'Want to read',read:'Read',paused:'Paused',dropped:'Abandoned'};
const D={lib:{1:{s:'read',p:100},4:{s:'reading',p:42},5:{s:'reading',p:66},2:{s:'want',p:0}},liked:[5,1],saved:[],goal:12,view:'landing',lv:'shelf',lf:'all',q:'',sort:'added',ft:'all',follow:[],
posts:[
{id:1,u:'Anika R.',ty:'review',bk:3,txt:'Short letters, long afterglow. Seneca on time made me rethink my whole week. ★★★★½',lk:24,cm:['Adding this to my list.'],ts:'2h'},
{id:2,u:'Marcus T.',ty:'quote',bk:1,txt:'“You have power over your mind, not outside events.” — a line I keep reopening.',lk:57,cm:[],ts:'5h'},
{id:3,u:'Leila H.',ty:'rec',bk:11,txt:'If you want a quiet book that still moves you: Siddhartha. Read it in one weekend.',lk:18,cm:[],ts:'1d'},
{id:4,u:'Dev S.',ty:'update',bk:7,txt:'Page 312 of Dune. The ecology chapters are better than I expected.',lk:9,cm:[],ts:'1d'}],
pl:[],ps:[],pf:[],
cols:[{id:1,n:'Books for overthinkers',d:'Stoic calm for restless minds.',th:'#304C43',vis:'public',bks:[1,3,10]},{id:2,n:'Dark academia',d:'Candlelight, guilt and gothic halls.',th:'#572C3B',vis:'public',bks:[12,8,6]}]};
let S;try{S=JSON.parse(localStorage.getItem('folio')||'null')}catch(e){}
S=Object.assign({},D,S||{});S.view='landing';
const sv=()=>{try{localStorage.setItem('folio',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),app=$('#app');
const cv=(b,x='')=>`<div class="cv ${x}" style="--a:${b.a};--b:${b.b}"><i>${b.t}</i><small>${b.au}</small></div>`;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
function stats(){const L=Object.entries(S.lib),rd=L.filter(([,v])=>v.s=='read').length;
 const pg=L.reduce((a,[i,v])=>a+Math.round(bk(i).pg*v.p/100),0);return{n:L.length,rd,pg}}
function render(){
 document.querySelectorAll('.tab').forEach(t=>t.removeAttribute('aria-current'));
 const t=[...document.querySelectorAll('.tab')].find(x=>x.dataset.v==S.view);if(t)t.setAttribute('aria-current','page');
 app.innerHTML={landing,library,feed,cols}[S.view]();
 if(S.view=='landing')count();
}
function landing(){const st=stats(),pos=[[-10,30,0],[130,0,-80],[250,60,40],[60,190,-40],[210,200,-120]];
 const dust=Array.from({length:18},(_,i)=>`<span class="dust" style="left:${(i*53)%100}%;top:${(i*37)%100}%"></span>`).join('');
 return`<section class="hero"><div class="hero-in"><div><h1>Your reading life, shelved.</h1>
 <p>Folio turns what you read into a library you can walk through, a feed of readers worth following, and playlists made of books.</p>
 <div class="row" style="margin-top:20px"><button class="btn" data-a="nav" data-v="library">Build your library</button><button class="btn o" style="color:#F5F0E8" data-a="nav" data-v="feed">See the feed</button></div>
 <div class="stats"><div><b data-n="${B.length}">0</b><span>books in the demo catalogue</span></div><div><b data-n="${st.n}">0</b><span>on your shelf</span></div><div><b data-n="${st.pg}">0</b><span>pages you’ve read</span></div></div></div>
 <div class="scene" aria-hidden="true">${dust}${pos.map((p,i)=>`<div class="fb" style="--x:${p[0]}px;--y:${p[1]}px;--z:${p[2]}px;animation-delay:${-i*1.3}s">${cv(B[[6,0,4,11,7][i]-(i==1?0:1)]||B[0])}</div>`).join('')}</div></div></section>
 <div class="feat"><div class="card"><h3>A library that stays honest</h3><p>Liking, saving and shelving are three separate actions. Stats come only from what you log.</p></div>
 <div class="card"><h3>Shelves, grid or list</h3><p>Switch views in one tap. The shelf shows your real books, sized by page count.</p></div>
 <div class="card"><h3>Readers, not just ratings</h3><p>Reviews, quotes and recommendations from people whose taste you follow.</p></div>
 <div class="card"><h3>Playlists for books</h3><p>Order them, theme them, share them with friends.</p></div></div>`}
function count(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now();
 const f=t=>{const k=Math.min(1,(t-t0)/900);e.textContent=Math.round(n*k);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function items(){let L=Object.entries(S.lib).map(([i,v])=>({...bk(i),...v,id:+i}));
 const f=S.lf;if(f=='liked')L=L.filter(b=>S.liked.includes(b.id));else if(f!='all')L=L.filter(b=>b.s==f);
 const q=S.q.toLowerCase();if(q)L=L.filter(b=>(b.t+b.au+b.g).toLowerCase().includes(q));
 const o=S.sort;if(o=='title')L.sort((a,b)=>a.t.localeCompare(b.t));if(o=='author')L.sort((a,b)=>a.au.localeCompare(b.au));if(o=='progress')L.sort((a,b)=>b.p-a.p);
 return L}
function lib(){const L=items();if(!Object.keys(S.lib).length)return`<div class="empty"><h3 class="serif">Your shelf is waiting</h3><p>Add your first book to see it here.</p><button class="btn" data-a="add">Discover books</button></div>`;
 if(!L.length)return`<div class="empty"><h3 class="serif">Nothing matches</h3><p>Try another filter or search term.</p></div>`;
 if(S.lv=='shelf'){const gs=[...new Set(L.map(b=>b.g))];
  return`<div class="shelf">${gs.map(g=>`<p class="serif" style="margin:10px 0 4px">${g}</p><div class="plank">${L.filter(b=>b.g==g).map(b=>`<button class="sp" data-a="open" data-id="${b.id}" style="--a:${b.a};--b:${b.b};width:${22+Math.round(b.pg/18)}px;height:${150+(b.id*13%40)}px" title="${b.t} – ${b.au}">${b.t}</button>`).join('')}</div>`).join('')}</div>`}
 const card=b=>`<div class="bk"><div data-a="open" data-id="${b.id}">${cv(b)}</div><div><h4>${b.t}</h4><p>${b.au}</p>
  <div class="bar" title="${b.p}%"><i style="width:${b.p}%"></i></div><p>${ST[b.s]} · ${b.p}%</p>
  <div class="row" style="margin-top:6px"><button class="ic ${S.liked.includes(b.id)?'on':''}" data-a="like" data-id="${b.id}" aria-pressed="${S.liked.includes(b.id)}">♥ Like</button><button class="ic ${S.saved.includes('b'+b.id)?'on':''}" data-a="save" data-id="b${b.id}">Save</button></div></div></div>`;
 return`<div class="${S.lv=='grid'?'grid':'list'}">${L.map(card).join('')}</div>`}
function library(){const st=stats(),pct=Math.min(100,Math.round(st.rd/S.goal*100));
 return`<div class="hd"><div><h2>My Library</h2><p style="color:var(--mut);margin:4px 0 0">${st.n} books · ${st.rd} read · ${st.pg} pages logged</p></div><button class="btn" data-a="add">+ Add book</button></div>
 <div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><b>${new Date().getFullYear()} goal: ${st.rd} of ${S.goal} books</b><label>Goal <input type="number" min="1" max="200" value="${S.goal}" data-ch="goal" style="width:64px"></label></div><div class="bar"><i style="width:${pct}%"></i></div></div>
 <div class="chips" role="group" aria-label="Filter by status">${[['all','All'],...Object.entries(ST),['liked','Liked']].map(([k,l])=>`<button class="chip" aria-pressed="${S.lf==k}" data-a="lf" data-id="${k}">${l}</button>`).join('')}</div>
 <div class="row"><input type="search" id="q" placeholder="Search your library" aria-label="Search your library" value="${S.q}">
 <select data-ch="sort" aria-label="Sort"><option value="added">Date added</option><option value="title">Title</option><option value="author">Author</option><option value="progress">Progress</option></select>
 <div class="row" role="group" aria-label="View">${['shelf','grid','list'].map(v=>`<button class="chip" aria-pressed="${S.lv==v}" data-a="lv" data-id="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div></div>
 <div id="lg">${lib()}</div>`}
function feed(){const T=[['all','For you'],['following','Following'],['review','Reviews'],['rec','Recommendations'],['quote','Quotes'],['update','Reading updates']];
 let P=S.posts.filter(p=>S.ft=='all'||(S.ft=='following'?S.follow.includes(p.u):p.ty==S.ft));
 return`<div style="max-width:660px;margin:0 auto"><h2>Feed</h2><div class="card" style="margin-top:14px"><textarea id="np" rows="2" placeholder="What are you reading?" aria-label="New post"></textarea>
 <div class="row" style="margin-top:8px"><select id="nb" aria-label="Book mentioned">${B.map(b=>`<option value="${b.id}">${b.t}</option>`).join('')}</select><select id="nt" aria-label="Post type"><option value="update">Reading update</option><option value="review">Review</option><option value="rec">Recommendation</option><option value="quote">Quote</option></select><button class="btn s" data-a="post">Post</button></div></div>
 <div class="chips">${T.map(([k,l])=>`<button class="chip" aria-pressed="${S.ft==k}" data-a="ft" data-id="${k}">${l}</button>`).join('')}</div>
 ${P.length?P.map(post).join(''):`<div class="empty"><h3 class="serif">No posts here yet</h3><p>${S.ft=='following'?'Follow a reader to fill this tab.':'Be the first to post.'}</p></div>`}</div>`}
function post(p){const b=bk(p.bk),lk=S.pl.includes(p.id),me=p.u=='You',inl=!!S.lib[b.id],lab={review:'Review',rec:'Recommendation',quote:'Quote',update:'Reading update'}[p.ty];
 return`<article class="card post"><div class="top"><div class="av" aria-hidden="true">${p.u[0]}</div><div><b>${p.u}</b> <span class="tag">${lab}</span><div style="font-size:12px;color:var(--mut)">${p.ts} ago${me?'':' · demo reader'}</div></div>
 ${me?`<button class="ic" style="margin-left:auto" data-a="del" data-id="${p.id}">Delete</button>`:`<button class="ic" style="margin-left:auto" data-a="fol" data-id="${p.u}">${S.follow.includes(p.u)?'Following':'Follow'}</button>`}</div>
 ${p.ty=='quote'?`<div class="q">${p.txt}</div>`:`<p style="margin:0">${p.txt}</p>`}
 <div class="pb"><div data-a="open" data-id="${b.id}" style="cursor:pointer">${cv(b)}</div><div style="flex:1"><b class="serif">${b.t}</b><div style="color:var(--mut);font-size:13px">${b.au}</div></div><button class="ic" data-a="plib" data-id="${b.id}" ${inl?'disabled':''}>${inl?'In library':'+ Library'}</button></div>
 <div class="acts"><button class="ic ${lk?'on':''}" data-a="pl" data-id="${p.id}" aria-pressed="${lk}">♥ ${p.lk+(lk?1:0)}</button><button class="ic" data-a="cmt" data-id="${p.id}">Comment ${p.cm.length}</button><button class="ic" data-a="rep" data-id="${p.id}">Repost</button><button class="ic ${S.saved.includes('p'+p.id)?'on':''}" data-a="save" data-id="p${p.id}">Save</button><button class="ic" data-a="copy" data-id="${p.id}">Copy link</button></div>
 ${p.cm.map(c=>`<div class="cm">${c}</div>`).join('')}</article>`}
function cols(){return`<div class="hd"><div><h2>Collections</h2><p style="color:var(--mut);margin:4px 0 0">Playlists made of books.</p></div><button class="btn" data-a="newcol">+ New collection</button></div>
 <div class="cols">${S.cols.map(c=>`<button class="col" data-a="oc" data-id="${c.id}" style="--th:${c.th}"><div class="stack">${c.bks.slice(0,3).map((i,k)=>cv(bk(i)).replace('class="cv "',`class="cv" `).replace('style="',`style="left:${24+k*60}px;z-index:${3-k};`)).join('')}</div><div class="in"><h3 style="font-size:18px">${c.n}</h3><p style="margin:2px 0;color:var(--mut)">${c.d||''}</p><span class="tag">${c.vis}</span> <span style="font-size:12px;color:var(--mut)">${c.bks.length} books</span></div></button>`).join('')}</div>`}
function dlg(h){const d=$('#dlg');d.innerHTML=h;if(!d.open)d.showModal()}
function openBook(id){const b=bk(id),e=S.lib[id];
 dlg(`<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="width:110px;flex:none">${cv(b)}</div><div style="flex:1;min-width:0"><h3 style="font-size:24px">${b.t}</h3><p style="margin:2px 0;color:var(--mut)">${b.au} · ${b.g} · ${b.pg} pages</p><p style="color:var(--mut);font-size:13px">Description, ISBN and publisher: not available in the demo catalogue.</p>
 <div class="row"><button class="ic ${S.liked.includes(id)?'on':''}" data-a="like" data-id="${id}">♥ Like</button><button class="ic ${S.saved.includes('b'+id)?'on':''}" data-a="save" data-id="b${id}">Save for later</button></div>
 <div class="row" style="margin-top:10px">${e?`<select data-ch="st" data-id="${id}" aria-label="Reading status">${Object.entries(ST).map(([k,l])=>`<option value="${k}" ${e.s==k?'selected':''}>${l}</option>`).join('')}</select><label>Progress <input type="range" min="0" max="100" value="${e.p}" data-ch="pr" data-id="${id}"></label><button class="ic" data-a="rm" data-id="${id}">Remove</button>`:`<button class="btn s" data-a="plib" data-id="${id}">Add to library</button>`}</div>
 <div class="row" style="margin-top:10px"><select id="ac" aria-label="Collection">${S.cols.map(c=>`<option value="${c.id}">${c.n}</option>`).join('')}</select><button class="ic" data-a="addcol" data-id="${id}">Add to collection</button></div></div></div>
 <div style="text-align:right;margin-top:14px"><button class="btn o s" data-a="close">Close</button></div>`)}
function addDlg(){dlg(`<h3>Add a book</h3><input type="search" id="as" placeholder="Search title or author" aria-label="Search catalogue" style="width:100%;margin:10px 0"><div id="ar" style="max-height:50vh;overflow:auto"></div><div style="text-align:right"><button class="btn o s" data-a="close">Close</button></div>`);ar('')}
function ar(q){q=q.toLowerCase();$('#ar').innerHTML=B.filter(b=>(b.t+b.au).toLowerCase().includes(q)).map(b=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--ln)"><b class="serif" style="flex:1">${b.t}<br><small style="font-family:Inter;font-weight:400;color:var(--mut)">${b.au}</small></b><button class="ic" data-a="plib" data-id="${b.id}" ${S.lib[b.id]?'disabled':''}>${S.lib[b.id]?'In library':'Add'}</button></div>`).join('')||'<p class="empty">No books match. Try another title or author.</p>'}
function colDlg(id){const c=S.cols.find(x=>x.id==id);
 dlg(`<h3 style="font-size:26px">${c.n}</h3><p style="color:var(--mut);margin:2px 0 10px">${c.d||''} <span class="tag">${c.vis}</span></p>
 ${c.bks.length?c.bks.map((i,k)=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--ln)"><span style="width:28px;flex:none">${cv(bk(i))}</span><span class="serif" style="flex:1">${bk(i).t}</span><button class="ic" data-a="mv" data-id="${id}" data-i="${k}" data-d="-1" aria-label="Move up" ${k?'':'disabled'}>↑</button><button class="ic" data-a="mv" data-id="${id}" data-i="${k}" data-d="1" aria-label="Move down" ${k<c.bks.length-1?'':'disabled'}>↓</button><button class="ic" data-a="cr" data-id="${id}" data-i="${k}">Remove</button></div>`).join(''):'<p class="empty">This collection is empty. Open any book to add it here.</p>'}
 <div class="row" style="margin-top:12px"><select id="cb" aria-label="Book to add">${B.filter(b=>!c.bks.includes(b.id)).map(b=>`<option value="${b.id}">${b.t}</option>`).join('')}</select><button class="btn s" data-a="ca" data-id="${id}">Add book</button><button class="btn o s" data-a="close" style="margin-left:auto">Close</button></div>`)}
function newCol(){dlg(`<h3>New collection</h3><div style="display:grid;gap:10px;margin-top:10px"><input type="text" id="cn" placeholder="Name, e.g. Books that feel like winter" aria-label="Name" maxlength="60"><input type="text" id="cd" placeholder="Short description" aria-label="Description" maxlength="120">
 <div class="row"><label>Theme <select id="ct"><option value="#304C43">Forest</option><option value="#572C3B">Burgundy</option><option value="#171923">Midnight</option><option value="#8a6a2f">Gold</option></select></label><label>Visibility <select id="cv2"><option>public</option><option>unlisted</option><option>private</option></select></label></div>
 <p id="ce" style="color:#c0392b;margin:0" role="alert"></p><div class="row"><button class="btn" data-a="mkcol">Create collection</button><button class="btn o" data-a="close">Cancel</button></div></div>`)}
const A={
nav(e){S.view=e.dataset.v;render();scrollTo(0,0)},
theme(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#171923';r.dataset.theme=d?'light':'dark'},
lf(e){S.lf=e.dataset.id;render()},lv(e){S.lv=e.dataset.id;render()},ft(e){S.ft=e.dataset.id;render()},
open(e){openBook(+e.dataset.id)},close(){$('#dlg').close()},add(){addDlg()},
like(e){const i=+e.dataset.id,k=S.liked.indexOf(i);k<0?S.liked.push(i):S.liked.splice(k,1);sv();render();if($('#dlg').open)openBook(i)},
save(e){const i=e.dataset.id,k=S.saved.indexOf(i);k<0?S.saved.push(i):S.saved.splice(k,1);toast(k<0?'Saved for later':'Removed from saved');sv();render();if($('#dlg').open&&i[0]=='b')openBook(+i.slice(1))},
plib(e){const i=+e.dataset.id;if(!S.lib[i])S.lib[i]={s:'want',p:0};sv();toast('Added to your library');render();if($('#ar'))ar($('#as').value);else if($('#dlg').open)openBook(i)},
rm(e){delete S.lib[e.dataset.id];sv();$('#dlg').close();render();toast('Removed from library')},
post(){const t=$('#np').value.trim();if(!t){toast('Write something first');return}
 S.posts.unshift({id:Date.now(),u:'You',ty:$('#nt').value,bk:+$('#nb').value,txt:t,lk:0,cm:[],ts:'0m'});sv();render();toast('Posted')},
del(e){S.posts=S.posts.filter(p=>p.id!=e.dataset.id);sv();render()},
pl(e){const i=+e.dataset.id,k=S.pl.indexOf(i);k<0?S.pl.push(i):S.pl.splice(k,1);sv();render()},
fol(e){const u=e.dataset.id,k=S.follow.indexOf(u);k<0?S.follow.push(u):S.follow.splice(k,1);sv();render()},
cmt(e){const t=prompt('Add a comment');if(t&&t.trim()){S.posts.find(p=>p.id==e.dataset.id).cm.push('You: '+t.trim().slice(0,200));sv();render()}},
rep(){toast('Reposted to your followers')},
copy(e){const u=location.href.split('#')[0]+'#post-'+e.dataset.id;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copied'),()=>toast('Copy not available here'))},
oc(e){colDlg(+e.dataset.id)},newcol(){newCol()},
mkcol(){const n=$('#cn').value.trim();if(!n){$('#ce').textContent='Give your collection a name.';return}
 S.cols.unshift({id:Date.now(),n,d:$('#cd').value.trim(),th:$('#ct').value,vis:$('#cv2').value,bks:[]});sv();render();colDlg(S.cols[0].id)},
ca(e){const c=S.cols.find(x=>x.id==e.dataset.id),v=$('#cb').value;if(v){c.bks.push(+v);sv();render();colDlg(c.id)}},
cr(e){const c=S.cols.find(x=>x.id==e.dataset.id);c.bks.splice(+e.dataset.i,1);sv();render();colDlg(c.id)},
mv(e){const c=S.cols.find(x=>x.id==e.dataset.id),i=+e.dataset.i,j=i+ +e.dataset.d;[c.bks[i],c.bks[j]]=[c.bks[j],c.bks[i]];sv();render();colDlg(c.id)},
addcol(e){const c=S.cols.find(x=>x.id==$('#ac').value);if(!c){toast('Create a collection first');return}
 if(c.bks.includes(+e.dataset.id))toast('Already in that collection');else{c.bks.push(+e.dataset.id);sv();render();toast('Added to '+c.n)}}};
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-a]');if(e&&A[e.dataset.a])A[e.dataset.a](e)});
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset.ch;if(!k)return;
 if(k=='sort'){S.sort=t.value;$('#lg').innerHTML=lib()}
 if(k=='goal'){S.goal=Math.max(1,+t.value||1);sv();render()}
 if(k=='st'){S.lib[t.dataset.id].s=t.value;if(t.value=='read')S.lib[t.dataset.id].p=100;sv();render();openBook(+t.dataset.id)}
 if(k=='pr'){S.lib[t.dataset.id].p=+t.value;if(+t.value==100)S.lib[t.dataset.id].s='read';sv();render();openBook(+t.dataset.id)}});
document.addEventListener('input',ev=>{if(ev.target.id=='q'){S.q=ev.target.value;$('#lg').innerHTML=lib()}if(ev.target.id=='as')ar(ev.target.value)});
render();
</script>
</body>
</html>
